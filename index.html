<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VITARA – Connected Care, Better Aging</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#1d2b25;--mu:#66776f;--pr:#2f7d5b;--pl:#dcefe5;--bd:#dfe8e3;--ok:#2f7d5b;--okb:#dcefe5;--wa:#a86a00;--wab:#fff0cf;--da:#b3261e;--dab:#fde2df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--tx:#e8f1ec;--mu:#9bb0a5;--pr:#5cc394;--pl:#23382d;--bd:#2a3a32;--ok:#6fd3a3;--okb:#1f3a2c;--wa:#f0bf5a;--wab:#3b2f12;--da:#ff8f86;--dab:#412120}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 18px;background:var(--pr);color:#fff;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;letter-spacing:.5px}header small{opacity:.85;display:block;font-size:12px}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 2px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--bg);border-radius:12px;padding:10px}.m b{font-size:20px;display:block}
.bdg{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.belum{background:var(--bg);color:var(--mu)}.stabil{background:var(--okb);color:var(--ok)}.perhatian{background:var(--wab);color:var(--wa)}.segera{background:var(--dab);color:var(--da)}
button.b,.b{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
button.s{background:var(--pl);color:var(--pr)}button.d{background:var(--da);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px;font-size:13px;cursor:pointer}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
label{font-size:12px;color:var(--mu)}
.it{padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.big{font-size:19px}.lan button.b{padding:18px;font-size:18px;margin-bottom:10px}
.role{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--tx);font:inherit;cursor:pointer}
.role b{display:block;color:var(--pr);font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2b25;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0}.ck input{width:20px;margin:0}
.sc{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
var S={role:null,tab:'home',sub:'obat',sel:0,
pasien:[{n:'Bapak Surono',u:78,kon:'Gula darah terkontrol, hipertensi ringan',v:[[126,80,36.6,96,74],[130,82,36.7,97,76],[124,78,36.5,97,72],[128,80,36.6,96,75],[135,86,36.8,95,78],[132,84,36.7,97,76],[128,78,36.7,97,74]]},
{n:'Ibu Siti Aminah',u:74,kon:'Diabetes melitus tipe 2',v:[[142,92,36.8,95,80],[138,88,36.7,96,78],[150,94,37.0,94,84]]}],
meds:[{n:'Amlodipin 5 mg',j:'07.00',d:1},{n:'Metformin 500 mg',j:'12.30',d:0},{n:'Vitamin D3',j:'19.00',d:0}],
acts:[{n:'Sarapan',j:'06.30',d:1},{n:'Mandi dan kebersihan diri',j:'08.30',d:1},{n:'Jalan pagi / mobilisasi',j:'09.30',d:0},{n:'Makan siang',j:'12.00',d:0},{n:'Tidur siang',j:'13.30',d:0}],
visits:[{t:'Senin, 26 Okt – 09.00',p:'Ns. Rina Kusuma',a:'Cek tanda vital dan edukasi diet',s:'Terjadwal'},{t:'Kamis, 22 Okt – 09.00',p:'Ns. Rina Kusuma',a:'Perawatan luka dan senam lansia',s:'Selesai'},{t:'Senin, 19 Okt – 09.00',p:'Ns. Rina Kusuma',a:'Cek tanda vital',s:'Selesai'}],
reports:[{t:'22 Okt 2026',by:'Ns. Rina Kusuma',r:'Tekanan darah stabil, pasien kooperatif, obat diminum teratur.',rek:'Lanjutkan diet rendah garam dan jalan pagi 15 menit.'}],
notifs:[{t:'Kemarin',x:'Jadwal kunjungan perawat Senin 09.00',k:'i'},{t:'Kemarin',x:'Laporan perkembangan baru tersedia',k:'i'}],
askep:[],chk:[{n:'Ukur tanda vital',d:1},{n:'Edukasi diet rendah garam',d:0},{n:'Pemeriksaan gula darah',d:0},{n:'Evaluasi kepatuhan obat',d:0}]};
function st(v){if(!v)return'belum';var s=v[0],d=v[1],t=v[2],o=v[3];if(s>=180||d>=110||o<92||t>=38.5)return'segera';if(s>=140||d>=90||o<95||t>=37.5||t<36)return'perhatian';return'stabil'}
var SL={belum:'Belum ada data',stabil:'Stabil',perhatian:'Perlu perhatian',segera:'Perlu tindak lanjut segera'};
function bd(k){return '<span class="bdg '+k+'">'+SL[k]+'</span>'}
function last(p){return p.v.length?p.v[p.v.length-1]:null}
function $(id){return document.getElementById(id)}
function toast(m){var e=$('toast');e.textContent=m;e.className='on';setTimeout(function(){e.className=''},2200)}
function notif(x,k){S.notifs.unshift({t:'Baru saja',x:x,k:k||'i'})}
function go(t){S.tab=t;draw()}
function chart(p){if(p.v.length<2)return '<div class="mu">Grafik muncul setelah minimal 2 pemeriksaan.</div>';var a=p.v.map(function(v){return v[0]}),w=300,h=110,mn=100,mx=180;
var pts=a.map(function(v,i){return (10+i*(w-20)/Math.max(a.length-1,1)).toFixed(0)+','+(h-10-(v-mn)/(mx-mn)*(h-20)).toFixed(0)});
var y140=(h-10-(140-mn)/(mx-mn)*(h-20)).toFixed(0);
return '<div class="sc"><svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Grafik tekanan darah sistolik"><line x1="0" x2="'+w+'" y1="'+y140+'" y2="'+y140+'" stroke="#b3261e" stroke-dasharray="4" opacity=".5"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#2f7d5b" stroke-width="3"/>'+pts.map(function(q){return '<circle cx="'+q.split(',')[0]+'" cy="'+q.split(',')[1]+'" r="4" fill="#2f7d5b"/>'}).join('')+'</svg></div><div class="mu">Sistolik (mmHg) · garis putus = batas 140 (contoh aturan)</div>'}
function vit(p){var v=last(p);if(!v)return '<div class="mu">Belum ada pemeriksaan. Perawat atau keluarga dapat menginput tanda vital.</div>';return '<div class="grid"><div class="m"><span class="mu">Tekanan darah</span><b>'+v[0]+'/'+v[1]+'</b><span class="mu">mmHg</span></div><div class="m"><span class="mu">Suhu</span><b>'+v[2]+' °C</b></div><div class="m"><span class="mu">SpO₂</span><b>'+v[3]+'%</b></div><div class="m"><span class="mu">Nadi</span><b>'+v[4]+'</b><span class="mu">x/menit</span></div></div>'}
function tog(list,i){S[list][i].d=S[list][i].d?0:1;if(list==='meds'&&S.meds[i].d)notif(S.pasien[S.sel].n+' sudah minum '+S.meds[i].n);draw()}
function list(l,k){return l.map(function(m,i){return '<div class="it row"><div><b>'+m.n+'</b><div class="mu">'+m.j+'</div></div><button class="b '+(m.d?'s':'')+'" style="width:auto" onclick="tog(\''+k+'\','+i+')">'+(m.d?'✓ Selesai':'Tandai')+'</button></div>'}).join('')}
function login(){S.role=null;S.scr=null;draw()}
function setRole(r){S.role=r;S.tab=r==='lansia'?'home':(r==='perawat'?'pasien':'home');S.sub='obat';draw()}
function draw(){persist();var a=$('app');
if(!S.role&&S.scr){a.innerHTML=scrn();if(S.scr==='join')jlab();return}
if(!S.role){a.innerHTML='<main style="display:flex;flex-direction:column;justify-content:center"><div style="text-align:center;margin-bottom:22px"><img src="./https://cdn.phototourl.com/member/2026-11-09-257d58dd-0105-492c-bcdd-8ce3a72b9ec0.jpg alt="Logo Ruang Teduh" style="width:110px;height:110px;object-fit:contain"><h1 style="margin:4px 0;color:var(--pr);letter-spacing:2px">VITARA</h1><div class="mu">Vitality, Integrated Technology, and Assisted care for the Elderly</div><div style="margin-top:6px;font-weight:600">Connected Care, Better Aging</div><div class="mu" style="margin-top:4px">Aplikasi pelayanan Ruang Teduh Home Care</div></div><h2>Kamu masuk sebagai siapa?</h2><div class="card"><b style="color:var(--pr);font-size:17px">👪 Keluarga</b><div class="mu" style="margin:4px 0 10px">Pantau kondisi lansia dari jarak jauh</div><button class="b" onclick="S.scr=\'reg\';draw()">Daftar akun baru</button><button class="b s" style="margin-top:8px" onclick="S.scr=\'join\';S.jr=\'keluarga\';draw()">Masuk dengan kode keluarga</button></div><div class="card"><b style="color:var(--pr);font-size:17px">🩺 Perawat</b><div class="mu" style="margin:4px 0 10px">Kelola pasien, tanda vital, askep, dan laporan</div><button class="b" onclick="S.scr=\'join\';S.jr=\'perawat\';draw()">Masuk sebagai perawat</button></div><div class="mu" style="text-align:center;margin-top:14px">Lansia masuk lewat kode keluarga (pilih peran Lansia).<br>Lihat contoh tampilan:</div><div class="row" style="justify-content:center;margin-top:8px"><button class="b s" style="width:auto;padding:6px 12px;font-size:13px" onclick="setRole(\'keluarga\')">Keluarga</button><button class="b s" style="width:auto;padding:6px 12px;font-size:13px" onclick="setRole(\'perawat\')">Perawat</button><button class="b s" style="width:auto;padding:6px 12px;font-size:13px" onclick="setRole(\'lansia\')">Lansia</button></div><div class="mu" style="text-align:center;margin-top:10px">Prototipe untuk keperluan akademik. Bukan layanan gawat darurat 24 jam dan bukan alat diagnosis. Kondisi darurat: hubungi 119 atau IGD terdekat.</div></main>';return}
var R=S.role,T=tabs(R),h='<header><div><b>VITARA</b><small>'+({keluarga:'Akun Keluarga',perawat:'Akun Perawat',lansia:'Akun Lansia'})[R]+'</small></div><button class="b s" style="width:auto;padding:6px 12px;font-size:13px" onclick="login()">Ganti peran</button></header><main class="'+(R==='lansia'?'lan':'')+'">'+page(R,S.tab)+'</main><nav>'+T.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</nav>';a.innerHTML=h}
function tabs(r){return {keluarga:[['home','🏠','Beranda'],['mon','📈','Monitoring'],['jad','📅','Jadwal'],['lap','📄','Laporan'],['prof','🔔','Notifikasi'],['akun','👤','Profil']],
perawat:[['pasien','👥','Pasien'],['input','🩺','Input'],['askep','📝','Askep'],['jdw','📅','Jadwal'],['lapn','📄','Laporan'],['prof','👤','Profil']],
lansia:[['home','🏠','Beranda'],['obat','💊','Obat'],['kel','💬','Keluhan'],['hub','📞','Hubungi']]}[r]}
function ptCard(p,i){var v=last(p);return '<div class="card"><div class="row"><div><b>'+p.n+', '+p.u+' th</b><div class="mu">'+p.kon+'</div></div>'+bd(st(v))+'</div></div>'}
function sos(){if(confirm('Kirim bantuan darurat ke keluarga dan perawat?')){notif('🚨 TOMBOL BANTUAN DARURAT ditekan oleh '+S.pasien[S.sel].n,'d');toast('Bantuan darurat terkirim');draw()}}
function pageOld(r,t){var p=S.pasien[S.sel],v=last(p),k=st(v),x='';if(r==='perawat'&&S.nurseMode&&!S.code&&t!=='pasien'&&t!=='prof')return '<div class="card mu">Pilih pasien dulu di tab Pasien.</div>';if(r==='perawat'&&t==='jdw')return jdw();if(r==='perawat'&&t==='prof'&&S.own)return nprof();if(r==='keluarga'&&t==='akun')return fprof(p);
if(r==='keluarga'){
if(t==='home'){x='<div class="card"><div class="row"><div><b class="big">'+p.n+', '+p.u+' tahun</b><div class="mu">'+(v?'Pemeriksaan terakhir tercatat di riwayat':'Belum ada pemeriksaan')+'</div></div>'+bd(k)+'</div></div>'+'<div class="card"><h3>Ringkasan kondisi</h3>'+vit(p)+'<div class="mu" style="margin-top:8px">Prototipe: status memakai aturan contoh; penilaian nyata mengikuti kondisi klinis dan target individual.</div></div><div class="card"><h3>Obat hari ini</h3>'+S.meds.map(function(m){return '<div class="row it"><span>'+m.n+' · '+m.j+'</span><span>'+(m.d?'✅':'⏳')+'</span></div>'}).join('')+'</div><div class="card"><h3>Kunjungan berikutnya</h3>'+(S.visits[0]?S.visits[0].t+'<div class="mu">'+S.visits[0].p+' · '+S.visits[0].a+'</div>':'<span class="mu">Belum ada jadwal kunjungan</span>')+'</div><button class="b d" onclick="sos()">🚨 Bantuan darurat</button>'}
if(t==='mon'){x='<h2>Monitoring kesehatan</h2><div class="card"><div class="row"><b>Status saat ini</b>'+bd(k)+'</div>'+vit(p)+'</div><div class="card"><h3>Grafik riwayat</h3>'+chart(p)+'</div><div class="card"><h3>Riwayat pemeriksaan</h3>'+p.v.slice().reverse().map(function(q,i){return '<div class="it row"><div>'+q[0]+'/'+q[1]+' mmHg · '+q[2]+'°C · SpO₂ '+q[3]+'%<div class="mu">Pemeriksa: '+(q[5]||'Ns. Rina')+'</div></div>'+bd(st(q))+'</div>'}).join('')+'</div><div class="mu">Status tidak disimpulkan dari satu angka saja; tinjau tren dan konsultasikan dengan perawat.</div>'}
if(t==='jad'){x='<div class="seg">'+[['obat','Obat'],['akt','Aktivitas'],['kun','Kunjungan']].map(function(s){return '<button class="'+(S.sub===s[0]?'on':'')+'" onclick="S.sub=\''+s[0]+'\';draw()">'+s[1]+'</button>'}).join('')+'</div><div class="card">'+(S.sub==='obat'?'<h3>Jadwal & pengingat obat</h3>'+S.meds.map(function(m){return '<div class="it row"><span><b>'+m.n+'</b><div class="mu">'+m.j+'</div></span><span>'+(m.d?'✅ Sudah':'⏳ Belum')+'</span></div>'}).join(''):S.sub==='akt'?'<h3>Aktivitas harian</h3>'+S.acts.map(function(m){return '<div class="it row"><span><b>'+m.n+'</b><div class="mu">'+m.j+'</div></span><span>'+(m.d?'✅':'⏳')+'</span></div>'}).join(''):'<h3>Jadwal kunjungan perawat</h3>'+S.visits.map(function(m){return '<div class="it"><b>'+m.t+'</b> <span class="bdg '+(m.s==='Selesai'?'stabil':'perhatian')+'">'+m.s+'</span><div class="mu">'+m.p+' · '+m.a+'</div></div>'}).join(''))+'</div>'}
if(t==='lap'){x='<h2>Laporan perkembangan</h2>'+(S.reports.length?S.reports.map(function(q){return '<div class="card"><b>'+q.t+'</b><div class="mu">Oleh '+q.by+'</div><p>'+q.r+'</p><b>Rekomendasi:</b><p>'+q.rek+'</p></div>'}).join(''):'<div class="card mu">Belum ada laporan.</div>')}
if(t==='prof'){x='<h2>Notifikasi</h2><div class="card">'+S.notifs.map(function(n){return '<div class="it"><span class="bdg '+(n.k==='d'?'segera':n.k==='w'?'perhatian':'stabil')+'">'+n.t+'</span> '+n.x+'</div>'}).join('')+'</div><div class="card"><h3>Profil & kontak</h3>Keluarga: '+(S.me||'Dewi Surono')+'<div class="mu">Kontak darurat: '+(p.kk||'Ns. Rina Kusuma · 0812-0000-0000 (contoh)')+'</div></div><button class="b d" onclick="sos()">🚨 Bantuan darurat</button>'}}
if(r==='perawat'){
if(t==='pasien'&&S.own&&S.nurseMode){x=nurseList()+(S.code?pinfo(p)+'<div class="card"><h3>Tanda vital</h3>'+vit(p)+chart(p)+'</div>':'');}else if(t==='pasien'){x='<h2>Daftar pasien lansia</h2>'+S.pasien.map(function(q,i){var s=st(last(q));return '<div class="card" onclick="S.sel='+i+';draw()" style="cursor:pointer;'+(i===S.sel?'border-color:var(--pr)':'')+'"><div class="row"><b>'+q.n+', '+q.u+' th</b>'+bd(s)+'</div><div class="mu">Riwayat: '+q.kon+'</div>'+(s==='perhatian'||s==='segera'?'<div class="mu" style="color:var(--wa)">⚠ Perlu tindak lanjut</div>':'')+'</div>'}).join('')+'<div class="card"><h3>Profil: '+p.n+'</h3>'+vit(p)+chart(p)+'</div>'}
if(t==='input'){x='<h2>Input tanda vital</h2><div class="card"><label>Pasien</label><select id="ip">'+S.pasien.map(function(q,i){return '<option value="'+i+'"'+(i===S.sel?' selected':'')+'>'+q.n+'</option>'}).join('')+'</select><div class="grid"><div><label>Sistolik</label><input id="a1" type="number" value="128"></div><div><label>Diastolik</label><input id="a2" type="number" value="80"></div><div><label>Suhu (°C)</label><input id="a3" type="number" step="0.1" value="36.7"></div><div><label>SpO₂ (%)</label><input id="a4" type="number" value="97"></div></div><label>Nadi (x/menit)</label><input id="a5" type="number" value="76"><button class="b" onclick="saveV()">Simpan pemeriksaan</button></div><div class="mu">Aturan status di prototipe hanyalah contoh; nilai sebenarnya ditetapkan tenaga kesehatan.</div>'}
if(t==='askep'){x='<h2>Asuhan keperawatan</h2><div class="card"><h3>Checklist tindakan</h3>'+S.chk.map(function(c,i){return '<label class="ck"><input type="checkbox" '+(c.d?'checked':'')+' onchange="S.chk['+i+'].d=this.checked?1:0"><span style="font-size:15px;color:var(--tx)">'+c.n+'</span></label>'}).join('')+'</div><div class="card"><h3>Dokumentasi untuk '+p.n+'</h3><label>Diagnosis keperawatan</label><textarea id="k1" rows="2"></textarea><label>Intervensi</label><textarea id="k2" rows="2"></textarea><label>Implementasi</label><textarea id="k3" rows="2"></textarea><label>Evaluasi</label><textarea id="k4" rows="2"></textarea><button class="b" onclick="saveA()">Simpan dokumentasi</button></div>'+S.askep.map(function(q){return '<div class="card"><b>'+q.t+'</b><div class="mu">Dx: '+q.a+'<br>Intervensi: '+q.b+'<br>Implementasi: '+q.c+'<br>Evaluasi: '+q.d+'</div></div>'}).join('')}
if(t==='lapn'){x='<h2>Buat laporan untuk keluarga</h2><div class="card"><label>Ringkasan perkembangan</label><textarea id="r1" rows="3"></textarea><label>Rekomendasi tindak lanjut</label><textarea id="r2" rows="3"></textarea><button class="b" onclick="saveR()">Kirim ke keluarga</button></div>'}
if(t==='prof'){x='<h2>Profil perawat</h2><div class="card"><b>'+(S.me||'Ns. Rina Kusuma')+'</b><div class="mu">Status akun: Terverifikasi ✅ (contoh)</div></div><h2>Jadwal kunjungan</h2><div class="card">'+S.visits.map(function(m){return '<div class="it"><b>'+m.t+'</b> <span class="bdg '+(m.s==='Selesai'?'stabil':'perhatian')+'">'+m.s+'</span><div class="mu">'+m.a+'</div></div>'}).join('')+'</div>'}}

if(r==='perawat'){if(!n){toast('Isi nama perawat');return}var nk=n.toLowerCase().replace(/\s+/g,' ');
getDoc('perawat',c).then(function(o){function go(){S.me=n;S.nc=c;S.nhp=(o&&o.hp)||esc($('jh').value.trim());S.own=true;S.code=null;S.lastD=null;fresh({n:'(belum ada pasien dipilih)',u:'-',kon:'-',v:[]});S.nurseMode=true;if(DB)subList();S.scr=null;setRole('perawat')}
if(!o){var hp=esc($('jh').value.trim());if(!hp){toast('Kode baru: isi no. kontak perawat dulu');return}setDoc('perawat',c,{n:n,nk:nk,hp:hp}).then(function(){toast('Kode perawat dibuat: '+c);go()});return}
if(o.nk!==nk){toast('Kode sudah dipakai perawat lain');return}go()}).catch(function(){toast('Gagal terhubung')});return}
S.me=n||'Pengguna';S.nurseMode=false;
function fin(id,o){apply(o);S.code=id;sub(id);S.scr=null;S.own=true;setRole(r)}
if(r==='lansia'){getDoc('kasus',c).then(function(o){if(!o){toast('Kode pasien tidak ditemukan');return}fin(c,o)}).catch(function(){toast('Gagal terhubung')});return}
findFam(c).then(function(f){if(!f){toast('Kode keluarga tidak ditemukan');return}fin(f.id,f.o)}).catch(function(){toast('Gagal terhubung')})}
function tel(h){return String(h||'').replace(/[^0-9+]/g,'')}
function call(h,l){return h?`<a class="b" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="tel:${tel(h)}">📞 ${l||'Hubungi'} · ${h}</a>`:'<div class="mu" style="margin-top:6px">Nomor perawat belum diisi</div>'}
function why(v){var a=[],s=v[0],d=v[1],t=v[2],o=v[3];if(s>=180||d>=110)a.push('Tekanan darah sangat tinggi ('+s+'/'+d+')');else if(s>=140||d>=90)a.push('Tekanan darah di atas batas ('+s+'/'+d+')');if(o<92)a.push('Saturasi oksigen rendah ('+o+'%)');else if(o<95)a.push('Saturasi oksigen agak rendah ('+o+'%)');if(t>=38.5)a.push('Demam tinggi ('+t+' °C)');else if(t>=37.5)a.push('Suhu agak tinggi ('+t+' °C)');else if(t<36)a.push('Suhu tubuh rendah ('+t+' °C)');return a}
function ol(a){return '<ol style="margin:6px 0 0;padding-left:20px">'+a.map(function(i){return '<li style="margin-bottom:5px">'+i+'</li>'}).join('')+'</ol>'}
function guide(p){var v=last(p);if(!v)return '';var k=st(v),w='<div class="mu" style="margin:6px 0">'+why(v).join(' · ')+'</div>',nt='<div class="mu" style="margin-top:8px">Panduan umum, bukan pengganti instruksi perawat atau dokter.</div>';
if(k==='stabil')return '<div class="card" style="border-color:var(--ok)"><b>✅ Kondisi stabil</b><div class="mu">Lanjutkan jadwal obat dan aktivitas, pastikan lansia cukup minum, dan pantau laporan dari perawat.</div></div>';
if(k==='perhatian')return '<div class="card" style="border-color:var(--wa)"><b>⚠️ Perlu perhatian: yang bisa dilakukan keluarga</b>'+w+ol(['Dampingi lansia dan minta ia beristirahat (duduk atau berbaring nyaman).','Tanyakan keluhannya (pusing, sesak, nyeri, lemas) dan catat.','Pastikan obat rutin diminum sesuai jadwal. Jangan menambah atau mengurangi dosis sendiri.','Ukur ulang 15–30 menit lagi bila ada alatnya, lalu kabari perawat.','Hubungi perawat jika keluhan menetap atau bertambah.'])+call(p.nhp,'Hubungi perawat')+nt+'</div>';
return '<div class="card" style="border-color:var(--da)"><b>🚨 Perlu tindak lanjut segera: lakukan ini</b>'+w+ol(['Tetap tenang dan dampingi lansia, jangan tinggalkan sendirian.','Posisikan senyaman mungkin (setengah duduk bila sesak, berbaring bila lemas atau pusing) dan longgarkan pakaian.','Segera hubungi perawat.','Jangan beri obat tambahan tanpa petunjuk perawat atau dokter.','Jika ada sesak berat, nyeri dada, penurunan kesadaran, tanda stroke (wajah mencong, lemah satu sisi, bicara pelo), perdarahan berat, atau kejang: hubungi 119 atau bawa ke IGD terdekat.'])+call(p.nhp,'Hubungi perawat')+nt+'</div>'}
function ncard(p){return '<div class="card"><h3>Perawat penanggung jawab</h3><b>'+(p.nurse||'-')+'</b><div class="mu">Kode '+(p.nc||'-')+'</div>'+call(p.nhp,'Hubungi perawat')+'</div>'}
function page1(r,t){var p=S.pasien[S.sel],v=last(p),k=st(v);
if(r==='lansia'&&t==='hub'){var fh=(p.fam&&p.fam.hp)||p.kk;return '<h2 class="big">Hubungi</h2>'+(fh?'<a class="b" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="tel:'+tel(fh)+'">📞 Keluarga · '+fh+'</a>':'')+call(p.nhp,'Perawat')+'<button class="b d" style="margin-top:12px" onclick="sos()">🚨 TOMBOL BANTUAN</button>'}
var x=pageOld(r,t);if(r==='keluarga'&&(t==='home'||t==='mon'))x=guide(p)+(t==='home'&&(k==='stabil'||k==='belum')?ncard(p):'')+x;return x}
function tm(){var d=new Date(),p=function(n){return n<10?'0'+n:n};return d.getDate()+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]+' '+p(d.getHours())+'.'+p(d.getMinutes())}
function notif(x,k){S.notifs.unshift({t:tm(),x:x,k:k||'i'})}
function who(){return S.role==='keluarga'?'Keluarga':S.role==='lansia'?'Lansia':'Perawat'}
function tog(l,i){var m=S[l][i];m.d=m.d?0:1;m.at=m.d?tm():'';if(m.d)notif(who()+' menandai selesai: '+m.n+' ('+m.j+')','i');draw()}
function rowB(k,i,m){return `<div class="it row"><div><b>${m.n}</b><div class="mu">${m.j}${m.d&&m.at?' · selesai '+m.at:''}</div></div><button class="b ${m.d?'s':''}" style="width:auto" onclick="tog('${k}',${i})">${m.d?'✓ Selesai':'Tandai selesai'}</button></div>`}
function list(l,k){return l.map(function(m,i){return rowB(k,i,m)}).join('')}
function sos(){if(S.sosT&&Date.now()-S.sosT<4000)return;S.sosT=Date.now();notif('🚨 TOMBOL BANTUAN DARURAT ditekan: '+S.pasien[S.sel].n,'d');toast('Bantuan darurat terkirim ke keluarga & perawat');draw()}
function add(){var j=$('at').value,n=esc($('ad1').value.trim()),w=esc($('ad2').value.trim());if(!n||!w){toast('Lengkapi nama dan waktu');return}
if(j==='obat')S.meds.push({n:n,j:w,d:0});else if(j==='akt')S.acts.push({n:n,j:w,d:0});else S.visits.unshift({t:w,p:esc($('ad3').value.trim())||(S.me||'Perawat'),a:n,s:'Terjadwal'});
notif('Jadwal baru dari perawat: '+n+' ('+w+')','i');toast('Ditambahkan & keluarga diberi notifikasi');draw()}
function st(v){if(!v)return'belum';var s=v[0],d=v[1],t=v[2],o=v[3],n=v[4],x=v[7]||{},g=x.g;if(s>=180||d>=110||o<92||t>=38.5||(g!=null&&(g>=400||g<54)))return'segera';if(s>=140||d>=90||o<95||t>=37.5||t<36||n>100||n<50||(g!=null&&(g>=200||g<70)))return'perhatian';return'stabil'}
function why(v){var a=[],s=v[0],d=v[1],t=v[2],o=v[3],n=v[4],g=(v[7]||{}).g;if(s>=180||d>=110)a.push('Tekanan darah sangat tinggi ('+s+'/'+d+')');else if(s>=140||d>=90)a.push('Tekanan darah di atas batas ('+s+'/'+d+')');if(o<92)a.push('Saturasi oksigen rendah ('+o+'%)');else if(o<95)a.push('Saturasi oksigen agak rendah ('+o+'%)');if(t>=38.5)a.push('Demam tinggi ('+t+' °C)');else if(t>=37.5)a.push('Suhu agak tinggi ('+t+' °C)');else if(t<36)a.push('Suhu tubuh rendah ('+t+' °C)');if(n>100||n<50)a.push('Nadi di luar batas ('+n+'/menit)');if(g!=null){if(g>=400||g<54)a.push('Gula darah sangat tidak normal ('+g+' mg/dL)');else if(g>=200||g<70)a.push('Gula darah di luar batas ('+g+' mg/dL)')}return a}
function vit(p){var v=last(p);if(!v)return '<div class="mu">Belum ada pemeriksaan. Perawat dapat menginput tanda vital.</div>';var x=v[7]||{},c=function(l,b,u){return '<div class="m"><span class="mu">'+l+'</span><b>'+b+'</b>'+(u?'<span class="mu">'+u+'</span>':'')+'</div>'},imt=x.bb&&x.tb?(x.bb/Math.pow(x.tb/100,2)).toFixed(1):null;
return '<div class="grid">'+c('Tekanan darah',v[0]+'/'+v[1],'mmHg')+c('Suhu',v[2]+' °C')+c('SpO₂',v[3]+'%')+c('Nadi',v[4],'x/menit')+(x.g!=null?c('Gula darah',x.g,'mg/dL'):'')+(x.rr!=null?c('Napas',x.rr,'x/menit'):'')+(x.bb!=null?c('Berat badan',x.bb,'kg'):'')+(x.tb!=null?c('Tinggi badan',x.tb,'cm'):'')+(imt?c('IMT',imt):'')+'</div>'+(v[6]?'<div class="mu" style="margin-top:6px">Diukur '+v[6]+(v[5]?' oleh '+v[5]:'')+'</div>':'')+(x.c?'<div class="mu">Catatan: '+x.c+'</div>':'')}
function hist(p){return '<div class="card"><h3>Riwayat tanda vital ('+p.v.length+' pemeriksaan)</h3>'+(p.v.length?p.v.slice().reverse().map(function(q){var x=q[7]||{},e=[x.g!=null?'Gula '+x.g+' mg/dL':'',x.rr!=null?'Napas '+x.rr+'/mnt':'',x.bb!=null?'BB '+x.bb+' kg':'',x.tb!=null?'TB '+x.tb+' cm':''].filter(Boolean).join(' · ');return '<div class="it"><div class="row"><b>'+(q[6]||'—')+'</b>'+bd(st(q))+'</div><div>TD '+q[0]+'/'+q[1]+' mmHg · Suhu '+q[2]+'°C · SpO₂ '+q[3]+'% · Nadi '+q[4]+'</div>'+(e?'<div class="mu">'+e+'</div>':'')+(x.c?'<div class="mu">Catatan: '+x.c+'</div>':'')+'<div class="mu">Pemeriksa: '+(q[5]||'Perawat')+'</div></div>'}).join(''):'<span class="mu">Belum ada pemeriksaan</span>')+'</div>'}
function monFam(p){return '<h2>Monitoring kesehatan</h2><div class="card"><div class="row"><b>Status saat ini</b>'+bd(st(last(p)))+'</div>'+vit(p)+'</div><div class="card"><h3>Grafik riwayat</h3>'+chart(p)+'</div>'+hist(p)+'<div class="mu">Status tidak disimpulkan dari satu angka saja; tinjau tren dan konsultasikan dengan perawat.</div>'}
function jadFam(){var s=S.sub||'obat',seg='<div class="seg">'+[['obat','Obat'],['akt','Aktivitas'],['kun','Kunjungan']].map(function(x){return `<button class="${s===x[0]?'on':''}" onclick="S.sub='${x[0]}';draw()">${x[1]}</button>`}).join('')+'</div>',b;
if(s==='obat')b='<h3>Jadwal & pengingat obat</h3><div class="mu">Setelah lansia minum obat, tekan “Tandai selesai”. Perawat akan melihatnya.</div>'+(S.meds.length?list(S.meds,'meds'):'<div class="mu" style="margin-top:8px">Belum ada jadwal. Perawat yang mengisi jadwal.</div>');
else if(s==='akt')b='<h3>Aktivitas harian</h3><div class="mu">Tekan “Tandai selesai” bila sudah dilakukan.</div>'+(S.acts.length?list(S.acts,'acts'):'<div class="mu" style="margin-top:8px">Belum ada aktivitas. Perawat yang mengisi.</div>');
else b='<h3>Jadwal kunjungan perawat</h3>'+(S.visits.length?S.visits.map(function(m){return '<div class="it"><b>'+m.t+'</b> <span class="bdg '+(m.s==='Selesai'?'stabil':'perhatian')+'">'+m.s+'</span><div class="mu">'+m.p+' · '+m.a+'</div></div>'}).join(''):'<div class="mu" style="margin-top:8px">Belum ada jadwal kunjungan.</div>');
return seg+'<div class="card">'+b+'</div>'}
function inputForm(){var F=function(id,l,x){return '<div><label>'+l+'</label><input id="'+id+'" type="number" '+(x||'')+'></div>'};return '<h2>Input tanda vital</h2><div class="card"><label>Pasien</label><select id="ip">'+S.pasien.map(function(q,i){return '<option value="'+i+'"'+(i===S.sel?' selected':'')+'>'+q.n+(S.code?' ('+S.code+')':'')+'</option>'}).join('')+'</select><div class="grid">'+F('a1','Sistolik (mmHg)')+F('a2','Diastolik (mmHg)')+F('a3','Suhu (°C)','step="0.1"')+F('a4','SpO₂ (%)')+F('a5','Nadi (x/menit)')+F('g2','Napas (x/menit)')+F('g1','Gula darah (mg/dL)')+F('g3','Berat badan (kg)','step="0.1"')+'</div>'+F('g4','Tinggi badan (cm)')+'<label>Catatan / keluhan</label><textarea id="g5" rows="2"></textarea><button class="b" onclick="saveV()">Simpan pemeriksaan</button></div><div class="mu">Tekanan darah, suhu, SpO₂, dan nadi wajib. Gula darah, napas, BB, dan TB opsional. Batas status di prototipe hanyalah contoh; nilai sebenarnya ditetapkan tenaga kesehatan.</div>'}
function saveV(){var i=+$('ip').value,n=function(id){var e=$(id);return e&&e.value!==''?+e.value:null},v=[n('a1'),n('a2'),n('a3'),n('a4'),n('a5')];
if(v.some(function(q){return q===null||isNaN(q)})){toast('Isi tekanan darah, suhu, SpO₂, dan nadi');return}
v[5]=S.me||'Perawat';v[6]=tm();v[7]={g:n('g1'),rr:n('g2'),bb:n('g3'),tb:n('g4'),c:esc($('g5').value.trim())};
S.pasien[i].v.push(v);var k=st(v);notif('Pemeriksaan baru '+S.pasien[i].n+': '+v[0]+'/'+v[1]+' mmHg, suhu '+v[2]+' °C, SpO₂ '+v[3]+'% – '+SL[k],k==='stabil'?'i':k==='segera'?'d':'w');toast('Tersimpan · Status: '+SL[k]);S.sel=i;S.tab='pasien';draw()}
function nform(){return `<div class="card"><h3>🔔 Kirim notifikasi ke keluarga</h3><label>Template</label><select onchange="$('nm').value=this.value"><option value="">Pilih template…</option><option value="Mohon pastikan lansia minum obat sesuai jadwal hari ini.">💊 Pengingat minum obat</option><option value="Perawat akan berkunjung sesuai jadwal. Mohon siapkan lansia dan catatan keluhannya.">📅 Pengingat kunjungan</option><option value="Kondisi lansia perlu perhatian. Mohon ikuti panduan di Beranda dan hubungi saya bila keluhan bertambah.">⚠️ Kondisi perlu perhatian</option><option value="Mohon bantu lansia makan teratur, cukup minum, dan melakukan aktivitas ringan hari ini.">🍽️ Makan, minum, aktivitas</option></select><label>Pesan</label><textarea id="nm" rows="3" placeholder="Tulis pesan untuk keluarga"></textarea><label>Tingkat</label><select id="nl2"><option value="i">Info</option><option value="w">Penting</option><option value="d">Mendesak</option></select><button class="b" onclick="sendN()">Kirim ke keluarga</button></div>`}
function sendN(){var t=esc($('nm').value.trim());if(!t){toast('Tulis pesan dulu');return}notif('Perawat '+(S.me||'')+': '+t,$('nl2').value);toast('Notifikasi terkirim ke keluarga');draw()}
function nb(n){return '<div class="it"><span class="bdg '+(n.k==='d'?'segera':n.k==='w'?'perhatian':'stabil')+'">'+n.t+'</span> '+n.x+'</div>'}
function recent(){return '<div class="card"><h3>Aktivitas & pesan terbaru</h3>'+(S.notifs.length?S.notifs.slice(0,6).map(nb).join(''):'<span class="mu">Belum ada aktivitas</span>')+'</div>'}
function page1x(r,t){return page1(r,t)}
function page(r,t){var p=S.pasien[S.sel],x;
if(r==='perawat'&&S.nurseMode&&!S.code&&t!=='pasien'&&t!=='prof')return page1(r,t);
if(r==='keluarga'){if(t==='jad')return jadFam();if(t==='mon')return guide(p)+monFam(p)+catFam()}
if(r==='perawat'&&t==='input')return inputForm()+catForm();
x=page1(r,t);
if(r==='keluarga'&&t==='home'&&S.notifs[0])x='<div class="card"><b>🔔 Notifikasi terbaru</b>'+nb(S.notifs[0])+'</div>'+x;
var open=S.code||!S.own;
if(r==='perawat'&&t==='pasien'&&open)x+=nform()+recent()+hist(p)+catFam();
if(r==='perawat'&&t==='lapn')x+=nform();
return x}
S.cat=[{t:'25 Okt 09.30',by:'Ns. Rina Kusuma',keb:['Mandi di tempat tidur','Kebersihan mulut'],mak:'Setengah porsi',cair:600,pos:'Miring kiri',kul:'Normal',area:'',eli:'Normal',c:'Data contoh.'}];
var _ap=apply;apply=function(o){_ap(o);S.cat=(JSON.parse(o.d).cat)||[]};
var _cu=cur;cur=function(){var c=_cu();c.cat=S.cat;return c};
var _fr=fresh;fresh=function(p){_fr(p);S.cat=[]};
function catForm(){var O=function(a){return a.map(function(x){return '<option>'+x+'</option>'}).join('')},K=function(id,l){return '<div class="ck"><input type="checkbox" id="'+id+'"><span>'+l+'</span></div>'};
return '<div class="card"><h3>🌿 Catatan Ruang Teduh (kunjungan)</h3><label>Kebersihan diri yang dilakukan</label>'+K('ck1','Mandi di tempat tidur')+K('ck2','Kebersihan mulut')+K('ck3','Ganti pakaian / linen')+'<label>Asupan makan</label><select id="cmk">'+O(['Habis','Setengah porsi','Sedikit','Tidak makan'])+'</select><label>Asupan cairan (ml)</label><input id="ccr" type="number"><label>Posisi / perubahan posisi</label><select id="cps">'+O(['Telentang','Miring kanan','Miring kiri','Setengah duduk'])+'</select><label>Kondisi kulit</label><select id="ckl">'+O(['Normal','Kemerahan','Lecet','Luka tekan'])+'</select><label>Area kulit yang diamati (jika ada temuan)</label><input id="car" placeholder="mis. area bokong / tumit"><label>Eliminasi (BAK/BAB)</label><select id="cel">'+O(['Normal','Ada keluhan'])+'</select><label>Catatan</label><textarea id="cct" rows="2"></textarea><button class="b" onclick="saveCat()">Simpan catatan</button></div>'}
function saveCat(){var g=function(i){return $(i).value},kb=[['ck1','Mandi di tempat tidur'],['ck2','Kebersihan mulut'],['ck3','Ganti pakaian / linen']].filter(function(x){return $(x[0]).checked}).map(function(x){return x[1]}),
e={t:tm(),by:S.me||'Perawat',keb:kb,mak:g('cmk'),cair:g('ccr')||'-',pos:g('cps'),kul:g('ckl'),area:esc(g('car').trim()),eli:g('cel'),c:esc(g('cct').trim())};
S.cat.unshift(e);if(e.kul!=='Normal')notif('⚠️ Catatan kulit: '+e.kul+(e.area?' di '+e.area:'')+'. Jangan memijat area kemerahan atau luka; ikuti arahan perawat.',e.kul==='Luka tekan'?'d':'w');else notif('Catatan Ruang Teduh baru dari perawat ('+e.t+')','i');
toast('Catatan tersimpan & keluarga diberi notifikasi');draw()}
function catFam(){return '<div class="card"><h3>🌿 Catatan Ruang Teduh</h3>'+(S.cat.length?S.cat.map(function(e){return '<div class="it"><div class="row"><b>'+e.t+'</b><span class="bdg '+(e.kul==='Normal'?'stabil':e.kul==='Luka tekan'?'segera':'perhatian')+'">Kulit: '+e.kul+'</span></div><div class="mu">Kebersihan: '+(e.keb&&e.keb.length?e.keb.join(', '):'-')+'</div><div>Makan: '+e.mak+' · Cairan: '+e.cair+(e.cair!=='-'?' ml':'')+' · Posisi: '+e.pos+' · Eliminasi: '+e.eli+'</div>'+(e.area?'<div class="mu">Area diamati: '+e.area+'</div>':'')+(e.kul!=='Normal'?'<div class="mu" style="color:var(--wa)">Jangan memijat area kemerahan atau luka; laporkan ke perawat.</div>':'')+(e.c?'<div class="mu">Catatan: '+e.c+'</div>':'')+'<div class="mu">Oleh '+e.by+'</div></div>'}).join(''):'<span class="mu">Belum ada catatan kunjungan</span>')+'</div>'}
draw();
</script>
